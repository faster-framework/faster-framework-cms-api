spring:
  datasource:
    url: jdbc:h2:mem:faster_cms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
  freemarker:
    cache: false

app:
  cms:
    site-dir: target/test-site
    page-size: 5
  jwt:
    secret: test-secret-faster-cms-0123456789abcdef-32bytes
    ttl: PT1H
  captcha:
    enabled: false
  upload:
    dir: target/test-upload
    max-size: 1MB

logging:
  level:
    root: WARN
    cn.org.faster.cms: INFO
    org.springframework: WARN
